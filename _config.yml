title: "Emile Petrinski"
email: "emile@blueantcorp.com"
description: "Portfolio and Blog"
baseurl: "" # leave empty unless hosted in a subdirectory
url: "https://www.petrinski.com"

theme: null # custom theme, not minima
markdown: kramdown

incremental: true   # optional, speeds up regeneration
livereload: true    # triggers browser reload

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Build settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# Defaults for pages and posts
defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Collections
collections:
  pages:
    output: true

# System preferences for dark/light mode
dark_mode: "media" # uses system preference

# Assets
sass:
  sass_dir: _sass
  style: compressed
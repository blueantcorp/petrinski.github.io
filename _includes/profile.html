<div class="profile">
  <h2>{{ site.data.profile.name }}</h2>
  <p class="role">{{ site.data.profile.role }}</p>
  <p class="location">{{ site.data.profile.location }}</p>
  <p class="contact">
    <a href="mailto:{{ site.data.profile.email }}">{{ site.data.profile.email }}</a> |
    <a href="tel:{{ site.data.profile.phone }}">{{ site.data.profile.phone }}</a>
  </p>
  <p class="links">
    <a href="https://{{ site.data.profile.linkedin }}" target="_blank">LinkedIn</a> |
    <a href="https://{{ site.data.profile.github }}" target="_blank">GitHub</a> |
    <a href="https://{{ site.data.profile.website }}" target="_blank">Website</a>
  </p>
  <p class="bio">{{ site.data.profile.bio }}</p>
</div>
